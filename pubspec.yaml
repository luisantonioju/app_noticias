name: app_noticias
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"

flutter:

  uses-material-design: true

  assets:
  - assets/img/logotipo.png


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/img/icone-portal-br.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

flutter_native_splash:
  color: "#ffffff"
  image: "assets/img/icone-portal-br.png"

  android_12:
    color: "#ffffff"
    image: "assets/img/icone-portal-br.png"